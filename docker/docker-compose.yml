services:
  opera-vlm:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        BASE: ubuntu:22.04
        MAMBA_USER_ID: ${UID:-1000}
        MAMBA_USER_GID: ${GID:-1000}
        # export OPERA_VLM_VERSION=$(docker/pep440-version.sh) before
        # `docker compose build`, or the image reports the placeholder
        OPERA_VLM_VERSION: ${OPERA_VLM_VERSION:-0.0.0.dev0+unknown}
    image: mgovorcin/opera-vlm:latest
    volumes:
      - ./data:/home/work/data
      - ./results:/home/work/results
    user: "${UID:-1000}:${GID:-1000}"
    command: opera-vlm --help

  # Interactive shell with data/results mounted
  opera-vlm-dev:
    extends: opera-vlm
    command: bash
