name: Tests
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm needs the tags

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          environments: dev
          cache: true

      - name: Tests
        run: pixi run -e dev pytest -v

      - name: Committed configs and CEOS matrix match the code
        run: |
          pixi run -e dev gen-configs
          git diff --exit-code configs/ docs/ceos-compliance.md
